<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Over - Dungeon Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #b8a88a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 2.4rem;
    margin-bottom: 8px;
    color: #d4af37;
    text-shadow: 0 0 20px rgba(212,175,55,0.4);
    letter-spacing: 3px;
  }
  .sub {
    color: #8a7a62;
    margin-bottom: 28px;
    font-size: 0.95rem;
  }
  .board {
    background: #14100c;
    border: 1px solid #3a3024;
    border-radius: 10px;
    padding: 24px 32px;
    width: 340px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  .row {
    display: flex;
    align-items: center;
    padding: 12px 14px;
    border-bottom: 1px solid #2a2018;
  }
  .row:last-child { border-bottom: none; }
  .row .rank {
    width: 28px;
    color: #6b5e4a;
    font-weight: bold;
  }
  .row.winner .rank { color: #d4af37; }
  .row .name { flex: 1; }
  .row.winner .name { color: #d4af37; }
  .row .score {
    color: #60c060;
    font-weight: bold;
  }
  .winner-badge {
    margin: 4px 0 16px;
    color: #d4af37;
    font-size: 1rem;
    text-align: center;
    text-shadow: 0 0 10px rgba(212,175,55,0.4);
  }
  .new-game-btn {
    display: block;
    text-align: center;
    margin: 22px auto 0;
    width: 100%;
    text-decoration: none;
    color: #60c060;
    background: #1a2a1a;
    border: 1px solid #306030;
    border-radius: 6px;
    padding: 12px;
    font-size: 1rem;
  }
  .new-game-btn:hover { background: #183018; }
  #msg {
    margin-top: 16px;
    color: #c06060;
    min-height: 1.2em;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<h1>Game Over</h1>
<div class="sub" id="sub"></div>
<div class="board">
  <div class="winner-badge" id="winner"></div>
  <div id="rows"></div>
  <a class="new-game-btn" href="/">＋ New Game</a>
</div>
<div id="msg"></div>

<script>
const params = new URLSearchParams(location.search);
const ROOM = params.get('room');
const msg = () => document.getElementById('msg');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

(async () => {
  if (!ROOM) { msg().textContent = '⚠ Missing game id'; return; }
  try {
    const r = await fetch(`/api/leaderboard?room=${encodeURIComponent(ROOM)}`, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const data = await r.json();
    document.getElementById('sub').textContent =
      'The goal was caught ' + data.totalCatches + ' time' + (data.totalCatches === 1 ? '' : 's') + ' · Game ' + data.id;
    document.getElementById('winner').textContent = '🏆 ' + data.winner + ' wins!';
    document.getElementById('rows').innerHTML = data.entries.map(e => {
      const cls = e.rank === 1 ? 'row winner' : 'row';
      return `<div class="${cls}">
        <span class="rank">${e.rank}.</span>
        <span class="name">${esc(e.name)}</span>
        <span class="score">${e.score} goal${e.score === 1 ? '' : 's'}</span>
      </div>`;
    }).join('');
  } catch (e) {
    msg().textContent = '⚠ ' + e.message;
  }
})();
</script>
</body>
</html>
