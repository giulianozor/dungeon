<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dungeon Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0d0d;
    color: #b8a88a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 {
    font-size: 2.2rem;
    margin-bottom: 32px;
    color: #d4af37;
    text-shadow: 0 0 18px rgba(212,175,55,0.35);
    letter-spacing: 3px;
  }
  .card {
    background: #14100c;
    border: 1px solid #3a3024;
    border-radius: 10px;
    padding: 24px 32px;
    width: 340px;
    box-shadow: 0 0 30px rgba(0,0,0,0.6);
  }
  .mode-btn {
    display: block;
    width: 100%;
    background: #1a1a1a;
    color: #d4af37;
    border: 1px solid #4a3a24;
    border-radius: 6px;
    padding: 16px;
    font-size: 1.05rem;
    cursor: pointer;
    margin-bottom: 14px;
    transition: background 0.15s, border-color 0.15s;
  }
  .mode-btn:hover { background: #252015; border-color: #d4af37; }
  .divider { text-align: center; color: #5a4c38; margin: 18px 0; font-size: 0.8rem; }
  .hidden { display: none; }
  .sub-row { display: flex; gap: 10px; }
  .sub-row .mode-btn { margin-bottom: 0; }
  fieldset { border: 1px solid #3a3024; border-radius: 8px; padding: 16px; margin-top: 16px; }
  legend { color: #8a7a62; font-size: 0.85rem; padding: 0 6px; }
  label { display: block; color: #8a7a62; font-size: 0.85rem; margin: 10px 0 4px; }
  input, select {
    width: 100%;
    background: #0d0d0d;
    color: #d4af37;
    border: 1px solid #3a3024;
    border-radius: 4px;
    padding: 8px 10px;
    font-size: 1rem;
    outline: none;
  }
  input:focus, select:focus { border-color: #6b5e4a; }
  .go-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    background: #1a2a1a;
    color: #60c060;
    border: 1px solid #306030;
    border-radius: 6px;
    padding: 12px;
    font-size: 1rem;
    cursor: pointer;
  }
  .go-btn:hover { background: #183018; }
  .back-btn {
    background: none;
    border: none;
    color: #6b5e4a;
    cursor: pointer;
    margin-top: 14px;
    font-size: 0.85rem;
    width: 100%;
  }
  .back-btn:hover { color: #b8a88a; }
  .hint { color: #6b5e4a; font-size: 0.8rem; margin-top: 6px; }
  #msg {
    margin-top: 16px;
    min-height: 1.2em;
    color: #c06060;
    text-align: center;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<h1>Dungeon Game</h1>

<div class="card">
  <div id="menu">
    <button id="btn-single" class="mode-btn">🕹 Single Player</button>
    <button id="btn-multi" class="mode-btn">👥 Multiplayer</button>
  </div>

  <div id="multi-options" class="hidden">
    <fieldset>
      <legend>Your name</legend>
      <input id="name-input" type="text" placeholder="e.g. Gromph" maxlength="24" autocomplete="off">
    </fieldset>
    <button id="btn-host" class="mode-btn">➕ Start New Game</button>
    <button id="btn-join" class="mode-btn">🔗 Join a Game</button>
    <div class="divider">or</div>
    <button id="btn-back-menu" class="back-btn">← Back</button>
  </div>

  <div id="host-form" class="hidden"></div>
  <div id="join-form" class="hidden"></div>
  <div id="single-form" class="hidden"></div>
  <div id="msg"></div>
</div>

<script>
const msg = () => document.getElementById('msg');

function getPid() {
  let pid = localStorage.getItem('dl_pid');
  if (!pid) {
    const buf = new Uint8Array(16);
    crypto.getRandomValues(buf);
    pid = Array.from(buf).map(b => b.toString(16).padStart(2, '0')).join('');
    localStorage.setItem('dl_pid', pid);
  }
  return pid;
}

async function post(query) {
  const r = await fetch('/api/' + query, { cache: 'no-store' });
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
  return body;
}

async function startGame(extra) {
  msg().textContent = '';
  try {
    const qs = new URLSearchParams(Object.assign({ pid: getPid() }, extra));
    const res = await post('create?' + qs.toString());
    location.href = '/game.html?room=' + encodeURIComponent(res.id) + '&pid=' + encodeURIComponent(getPid());
  } catch (e) {
    msg().textContent = '⚠ ' + e.message;
  }
}

function showSubMenus() {
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('multi-options').classList.remove('hidden');
}

function getName() {
  const name = document.getElementById('name-input').value.trim();
  if (!name) {
    msg().textContent = '⚠ Please choose a name';
    return null;
  }
  localStorage.setItem('dl_name', name);
  return name;
}

function renderHostForm() {
  const el = document.getElementById('host-form');
  el.classList.remove('hidden');
  el.innerHTML = `<fieldset>
    <legend>Start New Game</legend>
    <label for="host-players">Number of players</label>
    <select id="host-players">
      <option value="2">2 players</option>
      <option value="3">3 players</option>
      <option value="4">4 players</option>
    </select>
    <label for="host-goals">Goal catches to end the game</label>
    <input id="host-goals" type="number" min="1" max="99" value="3">
    <button id="btn-host-go" class="go-btn">Create Game</button>
  </fieldset>`;
  document.getElementById('btn-host-go').addEventListener('click', () => {
    const name = getName();
    if (!name) return;
    const players = parseInt(document.getElementById('host-players').value, 10) || 2;
    const goals = parseInt(document.getElementById('host-goals').value, 10) || 3;
    startGame({ mode: 'multi', name: name, players: players, goals: goals });
  });
}

function renderSingleForm() {
  const el = document.getElementById('single-form');
  el.classList.remove('hidden');
  el.innerHTML = `<fieldset>
    <legend>Single Player</legend>
    <label for="single-goals">Goal catches to end the game</label>
    <input id="single-goals" type="number" min="0" max="99" value="${localStorage.getItem('dl_goals') || 3}">
    <p class="hint">0 = endless game</p>
    <button id="btn-single-go" class="go-btn">Play</button>
  </fieldset>
  <button id="btn-back-single" class="back-btn">← Back</button>`;
  document.getElementById('btn-single-go').addEventListener('click', () => {
    const goals = parseInt(document.getElementById('single-goals').value, 10);
    const n = isNaN(goals) || goals < 0 ? 3 : goals;
    localStorage.setItem('dl_goals', String(n));
    startGame({ mode: 'single', goals: n });
  });
  document.getElementById('btn-back-single').addEventListener('click', () => {
    el.classList.add('hidden');
    document.getElementById('menu').classList.remove('hidden');
  });
}

function renderJoinForm() {
  const el = document.getElementById('join-form');
  el.classList.remove('hidden');
  el.innerHTML = `<fieldset>
    <legend>Join a Game</legend>
    <label for="join-id">Game ID</label>
    <input id="join-id" type="text" placeholder="e.g. AB3D" maxlength="6" autocomplete="off">
    <button id="btn-join-go" class="go-btn">Join</button>
  </fieldset>`;
  document.getElementById('btn-join-go').addEventListener('click', async () => {
    const id = document.getElementById('join-id').value.trim().toUpperCase();
    if (!id) { msg().textContent = '⚠ Enter a game id'; return; }
    const name = getName();
    if (!name) return;
    msg().textContent = '';
    try {
      const qs = new URLSearchParams({ pid: getPid(), room: id, name: name });
      await post('join?' + qs.toString());
      location.href = '/game.html?room=' + encodeURIComponent(id) + '&pid=' + encodeURIComponent(getPid());
    } catch (e) {
      msg().textContent = '⚠ ' + e.message;
    }
  });
}

document.getElementById('btn-single').addEventListener('click', () => {
  document.getElementById('menu').classList.add('hidden');
  renderSingleForm();
});
document.getElementById('btn-multi').addEventListener('click', () => {
  showSubMenus();
  document.getElementById('name-input').value = localStorage.getItem('dl_name') || '';
});
document.getElementById('btn-back-menu').addEventListener('click', () => {
  document.getElementById('multi-options').classList.add('hidden');
  document.getElementById('single-form').classList.add('hidden');
  document.getElementById('host-form').classList.add('hidden');
  document.getElementById('join-form').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
});
document.getElementById('btn-host').addEventListener('click', () => {
  document.getElementById('join-form').classList.add('hidden');
  renderHostForm();
});
document.getElementById('btn-join').addEventListener('click', () => {
  document.getElementById('host-form').classList.add('hidden');
  renderJoinForm();
});

const prefillRoom = (new URLSearchParams(location.search).get('room') || '').trim().toUpperCase();
if (prefillRoom) {
  showSubMenus();
  document.getElementById('name-input').value = localStorage.getItem('dl_name') || '';
  renderJoinForm();
  document.getElementById('join-id').value = prefillRoom;
}
</script>
</body>
</html>
